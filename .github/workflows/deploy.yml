name: Deploy

# A push reaches acc.chaithanin.com on its own — no pull request, no Cloud
# Shell. Pushing a working branch deploys it and then moves main to match, so
# main still names exactly what production is running.
#
# The checks run first and the deploy only starts if they pass, so a failing
# test stops the release rather than being discovered on the live site.
#
# What this gives up is the review step: whatever passes the checks goes live.
# That is the trade the team asked for, and it makes the checks the only thing
# standing between a push and live financial data — worth remembering before
# ever weakening them.
#
# The manual trigger exists for redeploying the same commit after a change made
# outside the repository — a rotated secret, a resized disk.
#
# The same checks also run on a pull request, for when one is opened anyway: a
# problem caught before the merge costs a commit, and one caught after costs a
# release.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two pushes deploying at once would race over the same VM and registry tag.
# The later one waits; it does not cancel the earlier, because a half-applied
# deploy is worse than a slow one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: check
    # A pull request runs the checks and stops there. Deploying from an
    # unmerged branch would put code on the live site that nobody has approved.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      # Mints the short-lived token that Google exchanges for credentials.
      # Without a stored service-account key there is nothing in this
      # repository worth stealing.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        env:
          GTG_PROJECT: ${{ vars.GCP_PROJECT }}
          GTG_REGION: ${{ vars.GCP_REGION }}
          GTG_DOMAIN: ${{ vars.GTG_DOMAIN }}
          # gcloud generates an SSH key on first use and would otherwise wait
          # for a passphrase that no one is there to type.
          CLOUDSDK_COMPUTE_SSH_GENERATE_KEY: '1'
        # The same script that a person runs by hand. Keeping one deploy path
        # means the automated release cannot drift from the manual one, and
        # --update leaves the VM, the disk and the reserved address alone.
        #
        # Built on the runner rather than by Cloud Build: the runner has a
        # Docker daemon and ample memory, and it saves this identity from
        # needing build and staging-bucket permissions across the project.
        run: ./deploy/deploy.sh --update --local-build

      - name: Verify the deployment answers
        env:
          GTG_DOMAIN: ${{ vars.GTG_DOMAIN }}
        # A deploy that finishes without the site coming back is a failure, and
        # the run should say so rather than turn green on a broken release.
        run: ./deploy/smoke-test.sh

  promote:
    # Moves main to whatever was just deployed from a working branch, so main
    # is never a guess about what production runs. Only after the deploy and
    # the smoke test have both passed: main should describe a release that
    # answered, not one that was merely attempted.
    needs: deploy
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward main to the deployed commit
        # A push made with GITHUB_TOKEN starts no further workflow run, which
        # is what keeps this from deploying the same commit a second time.
        #
        # Not forced: if main has moved on its own, the push is refused and
        # this fails loudly rather than discarding whatever landed there.
        run: git push origin HEAD:main
