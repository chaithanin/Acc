# Builds the container and pushes it to Artifact Registry.
#
# Built by Cloud Build rather than on the VM: an e2-micro has 1 GB of RAM and
# `next build` will not fit in it.
#
#   gcloud builds submit --config deploy/cloudbuild.yaml \
#     --substitutions=_REGION=asia-southeast1,_REPO=gtg,_IMAGE=financial-dashboard

substitutions:
  _REGION: asia-southeast1
  _REPO: gtg
  _IMAGE: financial-dashboard
  _TAG: latest
  # The commit this image was built from. Passed in by deploy.sh, because
  # the built-in $SHORT_SHA is only populated for builds started by a
  # repository trigger -- under `gcloud builds submit` it is empty, which
  # produced an image name ending in a bare colon and no build at all.
  _SHA: manual

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${_SHA}

options:
  # The default worker is ample; the build is CPU-bound for a couple of minutes.
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
